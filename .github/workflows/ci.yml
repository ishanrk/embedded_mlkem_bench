name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # runs optimized tests and sanitizer tests in separate builds
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: release
            build_type: Release
            lto: "ON"
            sanitize: "OFF"
          - name: sanitize
            build_type: Debug
            lto: "OFF"
            sanitize: "ON"
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build/${{ matrix.name }} -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DPQC_POLY_LTO=${{ matrix.lto }} -DPQC_POLY_SANITIZE=${{ matrix.sanitize }}
      - run: cmake --build build/${{ matrix.name }} --parallel 4
      - run: ctest --test-dir build/${{ matrix.name }} --output-on-failure
