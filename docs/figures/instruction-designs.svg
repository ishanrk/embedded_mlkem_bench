<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Custom instruction designs</title>
<desc id="desc">FQMUL RED32 and direct FSRI data paths</desc>
<rect width="1200" height="420" fill="white"/>
<style>text{font-family:system-ui,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.small{font-size:14px;fill:#5f6b7a}.label{font-size:16px}.value{font-size:14px;font-weight:650}.mono{font-family:ui-monospace,monospace}</style>
<text x="40" y="42" class="title">Three custom instruction designs</text>
<text x="40" y="68" class="small">The baseline keeps these three decoders disabled</text>
<rect x="40" y="100" width="350" height="260" rx="12" fill="#f7f9fc" stroke="#d7dde7"/>
<rect x="64" y="132" width="92" height="58" rx="7" fill="white" stroke="#aab5c5"/>
<rect x="180" y="122" width="130" height="78" rx="7" fill="white" stroke="#3568d4" stroke-width="2"/>
<rect x="334" y="132" width="36" height="58" rx="7" fill="white" stroke="#aab5c5"/>
<text x="64" y="130" class="title">FQMUL</text>
<text x="110" y="158" text-anchor="middle" class="small">inputs</text>
<text x="245" y="153" text-anchor="middle" class="value">multiply then Montgomery reduce</text>
<text x="352" y="166" text-anchor="middle" class="mono">rd</text>
<path d="M156 161H180M310 161H334" stroke="#5f6b7a" stroke-width="2"/>
<text x="64" y="240" class="label">signed low halves</text>
<text x="64" y="278" class="value">4 cycle response</text>
<rect x="420" y="100" width="350" height="260" rx="12" fill="#f7f9fc" stroke="#d7dde7"/>
<rect x="444" y="132" width="92" height="58" rx="7" fill="white" stroke="#aab5c5"/>
<rect x="560" y="122" width="130" height="78" rx="7" fill="white" stroke="#c84b4b" stroke-width="2"/>
<rect x="714" y="132" width="36" height="58" rx="7" fill="white" stroke="#aab5c5"/>
<text x="444" y="130" class="title">RED32</text>
<text x="490" y="158" text-anchor="middle" class="small">inputs</text>
<text x="625" y="153" text-anchor="middle" class="value">Montgomery reduce only</text>
<text x="732" y="166" text-anchor="middle" class="mono">rd</text>
<path d="M536 161H560M690 161H714" stroke="#5f6b7a" stroke-width="2"/>
<text x="444" y="240" class="label">signed product in rs1</text>
<text x="444" y="278" class="value">3 cycle response</text>
<rect x="800" y="100" width="350" height="260" rx="12" fill="#f7f9fc" stroke="#d7dde7"/>
<rect x="824" y="132" width="92" height="58" rx="7" fill="white" stroke="#aab5c5"/>
<rect x="940" y="122" width="130" height="78" rx="7" fill="white" stroke="#27866f" stroke-width="2"/>
<rect x="1094" y="132" width="36" height="58" rx="7" fill="white" stroke="#aab5c5"/>
<text x="824" y="130" class="title">FSRI</text>
<text x="870" y="158" text-anchor="middle" class="small">inputs</text>
<text x="1005" y="153" text-anchor="middle" class="value">shift then take low word</text>
<text x="1112" y="166" text-anchor="middle" class="mono">rd</text>
<path d="M916 161H940M1070 161H1094" stroke="#5f6b7a" stroke-width="2"/>
<text x="824" y="240" class="label">joined rs2 and rs1</text>
<text x="824" y="278" class="value">direct response</text>
<text x="40" y="397" class="small">All four processors use the same PCPI multiplier for ordinary RV32M multiplication</text>
</svg>
