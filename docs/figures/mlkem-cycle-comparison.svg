<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Complete ML-KEM cycle comparison</title>
<desc id="desc">Normalized cycle totals for key generation, encapsulation, and decapsulation on three ML-KEM parameter sets.</desc>
<rect width="1200" height="620" fill="white"/>
<style>
text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.title { font-size: 25px; font-weight: 700; fill: #172033; }
.subtitle { font-size: 15px; fill: #5f6b7a; }
.panel-title { font-size: 21px; font-weight: 700; fill: #172033; }
.label { font-size: 16px; fill: #172033; }
.small { font-size: 14px; fill: #5f6b7a; }
.value { font-size: 15px; font-weight: 650; fill: #172033; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<text class="title" x="50" y="43">Complete ML-KEM cycles relative to tuned software</text>
<text class="subtitle" x="50" y="70">Each total is keygen median + encapsulation median + decapsulation median. Lower is better.</text>
<rect x="420" y="91" width="17" height="17" rx="2" fill="#5f6b7a"/>
<text class="small mono" x="445" y="105">Tuned software</text>
<rect x="600" y="91" width="17" height="17" rx="2" fill="#3568d4"/>
<text class="small mono" x="625" y="105">mlk.fqmul</text>
<rect x="775" y="91" width="17" height="17" rx="2" fill="#c84b4b"/>
<text class="small mono" x="800" y="105">mlk.red32</text>
<rect x="950" y="91" width="17" height="17" rx="2" fill="#27866f"/>
<text class="small mono" x="975" y="105">fsri</text>
<line x1="100" y1="525.0" x2="1140" y2="525.0" stroke="#d7dde7"/>
<text class="small" x="86" y="530.0" text-anchor="end">0%</text>
<line x1="100" y1="451.7" x2="1140" y2="451.7" stroke="#d7dde7"/>
<text class="small" x="86" y="456.7" text-anchor="end">20%</text>
<line x1="100" y1="378.3" x2="1140" y2="378.3" stroke="#d7dde7"/>
<text class="small" x="86" y="383.3" text-anchor="end">40%</text>
<line x1="100" y1="305.0" x2="1140" y2="305.0" stroke="#d7dde7"/>
<text class="small" x="86" y="310.0" text-anchor="end">60%</text>
<line x1="100" y1="231.7" x2="1140" y2="231.7" stroke="#d7dde7"/>
<text class="small" x="86" y="236.7" text-anchor="end">80%</text>
<line x1="100" y1="158.3" x2="1140" y2="158.3" stroke="#d7dde7"/>
<text class="small" x="86" y="163.3" text-anchor="end">100%</text>
<line x1="100" y1="525" x2="1140" y2="525" stroke="#172033" stroke-width="1.5"/>
<rect x="163.0" y="158.3" width="52" height="366.7" rx="3" fill="#5f6b7a"/>
<text class="value" x="189.0" y="150.3" text-anchor="middle">100.0%</text>
<rect x="227.0" y="185.4" width="52" height="339.6" rx="3" fill="#3568d4"/>
<text class="value" x="253.0" y="177.4" text-anchor="middle">92.6%</text>
<rect x="291.0" y="181.2" width="52" height="343.8" rx="3" fill="#c84b4b"/>
<text class="value" x="317.0" y="173.2" text-anchor="middle">93.8%</text>
<rect x="355.0" y="262.2" width="52" height="262.8" rx="3" fill="#27866f"/>
<text class="value" x="381.0" y="254.2" text-anchor="middle">71.7%</text>
<text class="label" x="285" y="558" text-anchor="middle">ML-KEM-512</text>
<text class="small" x="285" y="582" text-anchor="middle">software total: 12,636,735 cycles</text>
<rect x="498.0" y="158.3" width="52" height="366.7" rx="3" fill="#5f6b7a"/>
<text class="value" x="524.0" y="150.3" text-anchor="middle">100.0%</text>
<rect x="562.0" y="178.7" width="52" height="346.3" rx="3" fill="#3568d4"/>
<text class="value" x="588.0" y="170.7" text-anchor="middle">94.4%</text>
<rect x="626.0" y="175.7" width="52" height="349.3" rx="3" fill="#c84b4b"/>
<text class="value" x="652.0" y="167.7" text-anchor="middle">95.3%</text>
<rect x="690.0" y="266.7" width="52" height="258.3" rx="3" fill="#27866f"/>
<text class="value" x="716.0" y="258.7" text-anchor="middle">70.4%</text>
<text class="label" x="620" y="558" text-anchor="middle">ML-KEM-768</text>
<text class="small" x="620" y="582" text-anchor="middle">software total: 20,143,356 cycles</text>
<rect x="833.0" y="158.3" width="52" height="366.7" rx="3" fill="#5f6b7a"/>
<text class="value" x="859.0" y="150.3" text-anchor="middle">100.0%</text>
<rect x="897.0" y="177.8" width="52" height="347.2" rx="3" fill="#3568d4"/>
<text class="value" x="923.0" y="169.8" text-anchor="middle">94.7%</text>
<rect x="961.0" y="174.3" width="52" height="350.7" rx="3" fill="#c84b4b"/>
<text class="value" x="987.0" y="166.3" text-anchor="middle">95.6%</text>
<rect x="1025.0" y="268.8" width="52" height="256.2" rx="3" fill="#27866f"/>
<text class="value" x="1051.0" y="260.8" text-anchor="middle">69.9%</text>
<text class="label" x="955" y="558" text-anchor="middle">ML-KEM-1024</text>
<text class="small" x="955" y="582" text-anchor="middle">software total: 30,964,081 cycles</text>
</svg>
